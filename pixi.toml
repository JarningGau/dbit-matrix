[workspace]
name = "dbit-matrix"
channels = [
  "https://mirrors.westlake.edu.cn/ANACONDA/cloud/conda-forge",
  "https://mirrors.westlake.edu.cn/ANACONDA/cloud/bioconda"
]
platforms = ["linux-64"]

[dependencies]
python = "3.11.*"
fastp = "0.24.*"
bwa = ">=0.7.19,<0.8"
sinto = ">=0.9.0,<0.10"
samtools = ">=1.23,<2"
biscuit = ">=1.7.1.20250908,<2"
star = ">=2.7.11b,<3"

[tasks]
make-cmd-dry-run = "python scripts/make_cmd.py --workflow-config workflow/dbit_taps_test.json --dry-run"
make-cmd-submit = "python scripts/make_cmd.py --workflow-config workflow/dbit_taps_test.json --submit"

[pypi-dependencies]
fuzzysearch = ">=0.8.1, <0.9"
setuptools = "<81"
matplotlib = ">=3.10.8, <4"
